---
- name: Baseline setup on all servers
  hosts: all
  become: yes
  roles:
    - common

- name: Jenkins Worker setup
  hosts: jenkins_worker
  become: yes
  roles:
    - docker_host
    - smoke_tests

- name: App Server setup
  hosts: app_server
  become: yes
  roles:
    - docker_host
    - smoke_tests

- name: Jenkins Manager install and bootstrap
  hosts: jenkins_manager
  become: yes
  roles:
    - jenkins_controller
  post_tasks:
    - name: Smoke-test Jenkins HTTP endpoint
      uri:
        url: "http://127.0.0.1:{{ jenkins_http_port }}/login"
        status_code: 200
      changed_when: false

    - name: Smoke-test Jenkins JCasC file exists
      stat:
        path: "{{ jenkins_casc_dir }}/jenkins.yaml"
      register: jenkins_casc_file
      failed_when: not jenkins_casc_file.stat.exists
      changed_when: false
