---
- name: Baseline setup on all servers
  hosts: all
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

- name: Jenkins Worker setup
  hosts: jenkins_worker
  become: yes
  tasks:
    - name: Install Java + Docker
      apt:
        name:
          - openjdk-17-jre
          - docker.io
        state: present
        update_cache: yes

    - name: Enable and start Docker
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Create remote Jenkins workspace dir
      file:
        path: /home/ubuntu/jenkins
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

- name: Jenkins Manager install + bootstrap (JCasC + plugins + agent key + node)
  hosts: jenkins_manager
  become: yes
  vars:
    jenkins_http_port: 8080
    jenkins_admin_password: "ChangeMe-Admin-Password"

    jcasc_dir: /var/lib/jenkins/casc
    plugins_file: /var/lib/jenkins/plugins.txt

    jenkins_war: /usr/share/java/jenkins.war
    plugin_mgr_jar: /opt/jenkins-plugin-manager.jar
    plugin_mgr_version: "2.13.2"

    controller_ssh_dir: /var/lib/jenkins/.ssh
    controller_agent_key: /var/lib/jenkins/.ssh/jenkins_agent
    controller_agent_pub: /var/lib/jenkins/.ssh/jenkins_agent.pub

  tasks:
    # --- prereqs + Jenkins install ---
    - name: Install prerequisites
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - apt-transport-https
          - fontconfig
          - net-tools
        state: present
        update_cache: yes

    - name: Install Java (needed for Jenkins)
      apt:
        name: openjdk-17-jre
        state: present

    - name: Ensure apt keyrings directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Jenkins repo signing key (current)
      get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        mode: "0644"
        force: yes

    - name: Add Jenkins apt repository
      copy:
        dest: /etc/apt/sources.list.d/jenkins.list
        content: |
          deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/
        owner: root
        group: root
        mode: "0644"

    - name: Update apt cache after adding Jenkins repo
      apt:
        update_cache: yes
        cache_valid_time: 0

    - name: Install Jenkins
      apt:
        name: jenkins
        state: present

    - name: Stop Jenkins (install plugins + config first)
      systemd:
        name: jenkins
        state: stopped

    # --- plugins (offline via plugin manager) ---
    - name: Copy plugins.txt to controller
      copy:
        src: files/jenkins/plugins.txt
        dest: "{{ plugins_file }}"
        owner: jenkins
        group: jenkins
        mode: "0644"

    - name: Download Jenkins plugin installation manager tool
      get_url:
        url: "https://github.com/jenkinsci/plugin-installation-manager-tool/releases/download/{{ plugin_mgr_version }}/jenkins-plugin-manager-{{ plugin_mgr_version }}.jar"
        dest: "{{ plugin_mgr_jar }}"
        mode: "0644"

    - name: Ensure Jenkins plugins directory exists
      file:
        path: /var/lib/jenkins/plugins
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0755"

    - name: Install plugins from plugins.txt
      shell: |
        set -euo pipefail
        java -jar "{{ plugin_mgr_jar }}" \
          --war "{{ jenkins_war }}" \
          --plugin-file "{{ plugins_file }}" \
          --plugin-download-directory /var/lib/jenkins/plugins
        chown -R jenkins:jenkins /var/lib/jenkins/plugins
      args:
        executable: /bin/bash

    # --- controller SSH key used to connect to worker ---
    - name: Ensure jenkins .ssh dir exists
      file:
        path: "{{ controller_ssh_dir }}"
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0700"

    - name: Generate SSH keypair for Jenkins agent connections (if missing)
      shell: |
        set -euo pipefail
        if [ ! -f "{{ controller_agent_key }}" ]; then
          sudo -u jenkins ssh-keygen -t ed25519 -N "" -f "{{ controller_agent_key }}"
        fi
        chown jenkins:jenkins "{{ controller_agent_key }}" "{{ controller_agent_pub }}"
        chmod 600 "{{ controller_agent_key }}"
        chmod 644 "{{ controller_agent_pub }}"
      args:
        executable: /bin/bash
        creates: "{{ controller_agent_key }}"

    - name: Read controller private key (for embedding into JCasC credential)
      slurp:
        src: "{{ controller_agent_key }}"
      register: controller_agent_priv_b64

    - name: Read controller public key (for worker authorized_keys)
      slurp:
        src: "{{ controller_agent_pub }}"
      register: controller_agent_pub_b64

    - name: Compute worker private IP from inventory host var
      set_fact:
        jenkins_worker_private_ip: "{{ hostvars[groups['jenkins_worker'][0]].jenkins_private_ip }}"

    - name: Create JCasC directory
      file:
        path: "{{ jcasc_dir }}"
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0755"

    - name: Render JCasC YAML (inject password + worker IP + controller private key)
      template:
        src: templates/jenkins/jenkins.yaml.j2
        dest: "{{ jcasc_dir }}/jenkins.yaml"
        owner: jenkins
        group: jenkins
        mode: "0644"
      vars:
        jcasc_admin_password: "{{ jenkins_admin_password }}"
        jcasc_worker_private_ip: "{{ jenkins_worker_private_ip }}"
        jcasc_controller_private_key: "{{ controller_agent_priv_b64.content | b64decode }}"

    # --- systemd drop-in: enable wizard disable + point Jenkins to JCasC file ---
    - name: Create systemd override dir for Jenkins
      file:
        path: /etc/systemd/system/jenkins.service.d
        state: directory
        mode: "0755"

    - name: Write Jenkins systemd drop-in (JAVA_OPTS only)
      copy:
        dest: /etc/systemd/system/jenkins.service.d/override.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Service]
          Environment="JAVA_OPTS=-Djava.awt.headless=true -Djenkins.install.runSetupWizard=false -Dcasc.jenkins.config={{ jcasc_dir }}/jenkins.yaml"

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Reset failed state (avoid StartLimit lockouts)
      shell: systemctl reset-failed jenkins || true
      args:
        executable: /bin/bash

    - name: Start Jenkins
      systemd:
        name: jenkins
        enabled: yes
        state: started

    - name: Wait for Jenkins to be reachable on port 8080
      wait_for:
        host: 127.0.0.1
        port: "{{ jenkins_http_port }}"
        timeout: 240

    - name: Show login + node info
      debug:
        msg:
          - "Jenkins is up on http://<JENKINS_MANAGER_PUBLIC_IP>:8080"
          - "Admin user: admin"
          - "Admin password: {{ jenkins_admin_password }}"
          - "Worker private IP: {{ jenkins_worker_private_ip }}"

- name: Authorize Jenkins controller SSH key on worker
  hosts: jenkins_worker
  become: yes
  vars:
    controller_host: "{{ groups['jenkins_manager'][0] }}"
  tasks:
    - name: Read controller public key from controller
      slurp:
        src: /var/lib/jenkins/.ssh/jenkins_agent.pub
      delegate_to: "{{ controller_host }}"
      run_once: true
      register: controller_pubkey

    - name: Add controller public key to ubuntu authorized_keys on worker
      authorized_key:
        user: ubuntu
        state: present
        key: "{{ controller_pubkey.content | b64decode }}"
